name: build-brave-linux-x64
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Brave Linux x64 {0} jobs={1}', inputs.brave_core_tag, inputs.compile_jobs) || 'Brave Linux x64 Core 2 Release' }}

on:
  workflow_dispatch:
    inputs:
      brave_core_tag:
        description: Brave core tag to build
        type: string
        default: v1.98.64
      compile_jobs:
        description: Siso/Ninja compile job limit
        type: string
        default: '4'
  push:
    branches: [build/brave-linux-core2]
    paths:
      - '.github/workflows/build-brave-linux-x64.yml'
      - 'build/brave/**'
      - 'build/posix/ci-parts.sh'
      - 'build/posix/restore-snapshot.sh'
      - 'tools/restore_posix_snapshot.py'
      - 'tools/snapshot_volumes.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: brave-linux-x64-core2-${{ github.ref }}
  cancel-in-progress: true

env:
  BRAVE_CORE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.brave_core_tag || 'v1.98.64' }}
  CHROMIX_BRAVE_JOBS: ${{ github.event_name == 'workflow_dispatch' && inputs.compile_jobs || '4' }}

jobs:
  build_1:
    name: Brave Linux x64 stage 1 (source sync + compile)
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      upload_snapshot: ${{ steps.stage.outputs.upload_snapshot }}
    steps:
      - name: Record stage deadline
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/brave-logs"

      - uses: actions/checkout@v4

        with:
          ref: build/brave-linux-core2
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pnpm 11.11.0
        run: npm install --global pnpm@11.11.0

      - name: Install snapshot and build utilities
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git ninja-build zstd file zip unzip

      - name: Run Brave stage 1
        id: stage
        run: |
          set -euo pipefail
          bash build/brave/ci-stage.sh "$RUNNER_TEMP/brave-build" 1 \
            2>&1 | tee "$RUNNER_TEMP/brave-logs/stage-1.log"

      - name: Upload checkpoint volume 1
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p1
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p1
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 2
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p2
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p2
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 3
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p3
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p3
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 4
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p4
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p4
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 5
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p5
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p5
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 6
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p6
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p6
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 7
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p7
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p7
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload checkpoint volume 8
        if: ${{ steps.stage.outputs.upload_snapshot == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-stage1-p8
          path: ${{ runner.temp }}/brave-build/.snapshot-stage-1/p8
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          compression-level: 0

      - name: Upload completed Brave browser
        if: ${{ steps.stage.outputs.finished == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-${{ env.BRAVE_CORE_TAG }}
          path: |
            ${{ runner.temp }}/brave-build/dist/brave-linux-x64.tar.zst
            ${{ runner.temp }}/brave-build/dist/SHA256SUMS
            ${{ runner.temp }}/brave-build/dist/brave-linux-x64/BUILD-INFO.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 0

      - name: Upload stage diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: brave-linux-x64-logs-stage1
          path: ${{ runner.temp }}/brave-logs/
          if-no-files-found: warn
          retention-days: 14


